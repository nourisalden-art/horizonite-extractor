buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "1.0.0"
group = "com.example.horizoniteextractor"
archivesBaseName = "horizonite-extractor"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'
    compileOnly files("libs/blue_skies-1.20.1-1.3.31.jar")
    runtimeOnly files("libs/blue_skies-1.20.1-1.3.31.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
